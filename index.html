<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Simulation Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <!-- Dynamic Content loads here -->
    </div>

    <!-- Floating Email Support Button -->
    <a id="supportBtn" href="mailto:support@yourbankdomain.com?subject=Support Inquiry" class="support-float" title="Contact Support">💬</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userQuery = urlParams.get('user');
        const path = window.location.pathname;
        const app = document.getElementById('app');

        if (window.location.pathname.includes('user-dashboard') && userQuery) {
            fetch(`/api/user-data?user=${userQuery}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) { window.location.href = '/'; return; }
                    document.getElementById('supportBtn').href = `mailto:${data.supportEmail}?subject=Support for ${data.username}`;
                    
                    let txHtml = data.transactions.map(t => `
                        <tr>
                            <td>${new Date(t.date).toLocaleDateString()}</td>
                            <td>${t.type}</td>
                            <td>$${t.amount.toFixed(2)}</td>
                            <td>${t.description}</td>
                        </tr>
                    `).join('');

                    app.innerHTML = `
                        <h1>Welcome, ${data.username}</h1>
                        <div class="balance-card">
                            <h3>Current Balance: <span style="color:#28a745;">$${data.balance.toFixed(2)}</span></h3>
                        </div>
                        <h2>Transaction History & Notifications</h2>
                        <table>
                            <tr><th>Date</th><th>Type</th><th>Amount</th><th>Description / Notification</th></tr>
                            ${txHtml || '<tr><td colspan="4">No transactions found.</td></tr>'}
                        </table>
                        <br>
                        <a href="/" class="btn btn-danger">Log Out</a>
                    `;
                });
        } else if (window.location.pathname.includes('admin-panel') && userQuery) {
            fetch('/api/admin-data')
                .then(res => res.json())
                .then(data => {
                    let userRows = data.users.map(u => `
                        <tr>
                            <td>${u.username}</td>
                            <td>$${u.balance.toFixed(2)}</td>
                            <td>
                                <form action="/admin/update-balance" method="POST" style="display:inline;">
                                    <input type="hidden" name="userId" value="${u._id}">
                                    <input type="number" step="0.01" name="newBalance" value="${u.balance}" style="width:90px;" required>
                                    <button type="submit" class="btn" style="padding:5px 10px;">Set</button>
                                </form>
                            </td>
                        </tr>
                    `).join('');

                    let txRows = data.transactions.map(t => `
                        <tr>
                            <td>${t.username}</td>
                            <td>${t.type}</td>
                            <td>$${t.amount}</td>
                            <td>${t.description}</td>
                            <td>
                                <form action="/admin/edit-transaction" method="POST" style="display:inline;">
                                    <input type="hidden" name="txId" value="${t._id}">
                                    <input type="text" name="newDescription" value="${t.description}" style="width:130px;" required>
                                    <button type="submit" class="btn" style="padding:3px 6px;">Edit</button>
                                </form>
                            </td>
                        </tr>
                    `).join('');

                    let selectOptions = data.users.map(u => `<option value="${u.username}">${u.username}</option>`).join('');

                    app.innerHTML = `
                        <h1>Admin Control Panel</h1>
                        <p>Manage client accounts, update balances, edit price tags/amounts, and modify transaction notifications.</p>
                        
                        <h2>Client Accounts</h2>
                        <table>
                            <tr><th>Username</th><th>Balance</th><th>Action / Edit Amount</th></tr>
                            ${userRows}
                        </table>

                        <h2 style="margin-top:25px;">Send Custom Transaction / Notification</h2>
                        <form action="/admin/send-transaction" method="POST">
                            <div class="form-group">
                                <label>Client Username:</label>
                                <select name="username" required>${selectOptions}</select>
                            </div>
                            <div class="form-group">
                                <label>Type:</label>
                                <select name="type">
                                    <option value="Credit">Credit (Add Money)</option>
                                    <option value="Debit">Debit (Deduct Money)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Amount / Price Tag:</label>
                                <input type="number" step="0.01" name="amount" required>
                            </div>
                            <div class="form-group">
                                <label>Notification Note:</label>
                                <input type="text" name="description" placeholder="e.g. Deposit verified successfully" required>
                            </div>
                            <button type="submit" class="btn">Send Notification & Update Balance</button>
                        </form>

                        <h2 style="margin-top:25px;">Recent Transactions / Notifications</h2>
                        <table>
                            <tr><th>User</th><th>Type</th><th>Amount</th><th>Description</th><th>Modify</th></tr>
                            ${txRows}
                        </table>
                        <br><br>
                        <a href="/" class="btn btn-danger">Log Out</a>
                    `;
                });
        } else {
            app.innerHTML = `
                <h1>Banking Portal Login</h1>
                <form action="/login" method="POST">
                    <div class="form-group">
                        <label>Username:</label>
                        <input type="text" name="username" required autocapitalize="none">
                    </div>
                    <div class="form-group">
                        <label>PIN / Password:</label>
                        <input type="password" name="pin" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
                <hr style="margin:20px 0;">
                <h2>Create Account</h2>
                <form action="/register" method="POST">
                    <div class="form-group">
                        <label>Username:</label>
                        <input type="text" name="username" required autocapitalize="none">
                    </div>
                    <div class="form-group">
                        <label>PIN:</label>
                        <input type="password" name="pin" required>
                    </div>
                    <button type="submit" class="btn" style="background:#28a745;">Register</button>
                </form>
            `;
        }
    </script>
</body>
</html>
