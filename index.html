        function sendChatMessage() {
            const input = document.getElementById('chat-input');

            if(!txt) return;

            appState.chatMessages.push({ sender: 'user', text: txt, time: 'Just now' });
            input.value = '';
            renderCurrentView();

            setTimeout(() => {
                appState.chatMessages.push({ sender: 'support', text: 'Thank you for your message. Our owner/customer support team has received your inquiry and will reply shortly, or email us at supportchat004@gmail.com.', time: 'Just now' });
                renderCurrentView();
            }, 1000);
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                appState.currentUser.avatar = e.target.result;
                // Also update in clients list
                const idx = appState.clients.findIndex(c => c.email === appState.currentUser.email);
                if(idx !== -1) {
                    appState.clients[idx].avatar = e.target.result;
                }
                saveClients();
                showToast(t('profile_photo_updated'));
                renderCurrentView();
            };
            reader.readAsDataURL(file);
        }

                            <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700 space-y-3">
                                <div class="flex justify-between items-start">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-full bg-kakaoYellow text-gray-900 flex items-center justify-center font-bold overflow-hidden shrink-0">

                                                <h4 class="text-xs font-bold text-white">${client.email}</h4>
                                            </div>
                                            <p class="text-[10px] text-gray-400 mt-0.5">Phone: ${client.phone} \vert{} Acc:${client.accountNumber}</p>
                                        </div>
                                    </div>
                                    <span class="text-sm font-black text-yellow-400">₩${client.balance.toLocaleString('en-US', {minimumFractionDigits: 2})}</span>
                                </div>

                                <div class="pt-2 border-t border-gray-700 flex items-center space-x-2">
                                    <input type="number" id="bal-input-${idx}" placeholder="Amount" class="flex-1 bg-gray-900 border border-gray-600 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-1 focus:ring-yellow-400">
                                    <button onclick="modifyClientBalance(${idx}, 'credit')" class="px-3 py-2 bg-green-600 text-white rounded-xl text-xs font-bold" data-i18n="credit">${t('credit')}</button>
                                    <button onclick="modifyClientBalance(${idx}, 'debit')" class="px-3 py-2 bg-red-600 text-white rounded-xl text-xs font-bold" data-i18n="debit">${t('debit')}</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function modifyClientBalance(index, action) {
            const inputVal = parseFloat(document.getElementById(`bal-input-${index}`).value);
            if(isNaN(inputVal) || inputVal <= 0) {
                showToast('Please enter a valid amount');
                return;
            }

            let client = appState.clients[index];
            if (action === 'credit') {
                client.balance += inputVal;
                client.transactions.unshift({ title: 'Owner Deposit / Credit', amount: '+₩' + inputVal.toLocaleString(), date: new Date().toLocaleDateString() });
                showToast(`Successfully credited ₩${inputVal}`);
            } else {
                client.balance = Math.max(0, client.balance - inputVal);
                client.transactions.unshift({ title: 'Owner Withdrawal / Debit', amount: '-₩' + inputVal.toLocaleString(), date: new Date().toLocaleDateString() });
                showToast(`Successfully debited ₩${inputVal}`);
            }

            saveClients();
            renderCurrentView();
        }

        // --- AUTOMATIC REAL-TIME TRANSLATOR ENGINE ---
        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang] && translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        const originalRenderCurrentView = renderCurrentView;
        renderCurrentView = function() {
            originalRenderCurrentView();
            applyTranslations();
        }

        window.onload = function() {
            renderCurrentView();
        };
    </script>
